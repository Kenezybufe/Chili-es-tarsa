<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csiri és Társa - Teljes Katalógus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); display: flex; align-items: center; padding: 0 30px; z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-toggle-btn { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: none; color: white; padding: 10px 24px; border-radius: 50px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: transform 0.2s; }
        .menu-toggle-btn:hover { transform: scale(1.05); }

        .sidebar { position: fixed; top: 70px; left: -320px; width: 320px; height: calc(100vh - 70px); background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px); transition: 0.3s; padding: 20px; z-index: 99; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar.active { left: 0; }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }
        
        .menu-btn { width: 100%; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #cbd5e1; border-radius: 10px; margin-bottom: 8px; cursor: pointer; text-align: left; transition: all 0.2s; }
        .menu-btn:hover { background: rgba(255,255,255,0.08); }
        
        .submenu { display: none; padding-left: 20px; margin-bottom: 10px; }
        .submenu.show { display: block; }
        .submenu-btn { width: 100%; padding: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; text-align: left; transition: color 0.2s; }
        .submenu-btn:hover { color: #60a5fa; }

        .main-content { margin-top: 70px; padding: 50px 30px; }
        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-hero { max-width: 250px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .content-container { max-width: 1200px; margin: 0 auto; }
        
        .category-title { font-size: 2.5rem; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .category-desc { color: #94a3b8; font-size: 1.1rem; margin-bottom: 20px; }
        
        .brand-section { margin-bottom: 40px; }
        .brand-title { font-size: 1.6rem; font-weight: 600; color: #e2e8f0; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .brand-title .brand-icon { font-size: 1.8rem; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .product-card { background: rgba(30, 41, 59, 0.7); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .product-img-container { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 15px; margin-bottom: 15px; overflow: hidden; }
        .product-img { max-width: 85%; max-height: 85%; object-fit: contain; }
        .product-img-placeholder { width: 60px; height: 60px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #94a3b8; }
        
        .product-name { font-weight: 600; margin-bottom: 5px; flex-grow: 1; font-size: 0.9rem; line-height: 1.3; }
        .product-price { color: #ff4a5a; font-weight: 800; font-size: 1.2rem; margin-top: 10px; }
        .drs-notice { font-size: 0.8rem; color: #94a3b8; min-height: 20px; }
        .drs-notice.drs { color: #fbbf24; }

        @media (max-width: 768px) {
            .header { padding: 0 15px; }
            .sidebar { width: 280px; left: -280px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .category-title { font-size: 1.8rem; }
            .main-content { padding: 20px 15px; }
            .brand-title { font-size: 1.3rem; }
        }
    </style>

    </header>

            <div id="productContainer"></div>

        function renderProductCard(item) {
            const imgHtml = item.img ? 
                `<img src="${item.img}" class="product-img" onerror="this.parentElement.innerHTML='<div class=\\'product-img-placeholder\\'>${getPlaceholder(item.name)}</div>'">` :
                `<div class="product-img-placeholder">${getPlaceholder(item.name)}</div>`;
            
            return `
                <div class="product-card">
                    <div class="product-img-container">${imgHtml}</div>
                    <div class="product-name">${item.name}</div>
                    <div class="drs-notice ${item.drs ? 'drs' : ''}">${item.drs ? '♻️ +50 Ft visszaváltási díj' : '&nbsp;'}</div>
                    <div class="product-price">${item.price}</div>
                </div>
            `;
        }

        function showCategory(key) {
            const data = productsData[key];
            document.getElementById('catTitle').innerText = data.title;
            document.getElementById('catDesc').innerText = data.desc;
            
            let html = '';
            data.brands.forEach(brand => {
                html += `
                    <div class="brand-section">
                        <div class="brand-title">
                            <span class="brand-icon">${brand.icon}</span>
                            ${brand.name}
                        </div>
                        <div class="product-grid">
                            ${brand.items.map(item => renderProductCard(item)).join('')}
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('productContainer').innerHTML = html;
            document.getElementById('sidebar').classList.remove('active');
        }

        function toggleSubmenu(id) { 
            document.getElementById(id).classList.toggle('show'); 
        }
        
        document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('active');
        
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.getElementById('menuToggle');
            if (sidebar.classList.contains('active') && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });
    </script>
