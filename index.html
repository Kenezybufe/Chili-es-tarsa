<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cyber Termék Katalógus</title>
    <style>
        /* Globális alapok és modern betűtípus */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Modern Sötét Háttér */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Felső Fejléc - Áttetsző sötét üveg hatás */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Neon kék világító gomb */
        .menu-toggle-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }

        /* Bal oldali Prémium Sötét Sidebar */
        .sidebar {
            position: fixed;
            top: 70px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 70px);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px 15px;
            overflow-y: auto;
            z-index: 99;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar.active {
            left: 0;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Elegáns Menü gombok a sötétben */
        .menu-btn {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: #cbd5e1;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .arrow {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #64748b;
        }

        .menu-btn.open .arrow {
            transform: rotate(90deg);
            color: #60a5fa;
        }

        /* Almenü stílusa */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: rgba(15, 23, 42, 0.6);
            list-style: none;
            border-radius: 14px;
            margin-top: 5px;
        }

        .submenu-btn {
            width: 100%;
            padding: 14px 25px;
            background: none;
            border: none;
            color: #94a3b8;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .submenu-btn:before {
            content: "•";
            color: #475569;
            margin-right: 12px;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .submenu-btn:hover {
            color: #60a5fa;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Fő tartalom rész */
        .main-content {
            margin-top: 70px;
            padding: 50px 30px;
            width: 100%;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            body.sidebar-open .main-content {
                margin-left: 320px;
            }
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .category-desc {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* --- EXKLUZÍV SÖTÉT TERMÉKRÁCS --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            padding: 10px 0;
        }

        /* Cyber Termékkártya stílusa */
        .product-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Termék képe konténer */
        .product-img-container {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Kártya alsó infó része */
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            background: rgba(30, 41, 59, 0.4);
        }

        .product-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
            min-height: 44px;
            line-height: 1.4;
        }

        /* DRS Visszaváltási infó szöveg stílusa */
        .drs-notice {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .product-price-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        /* Neon piros világító ár */
        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff4a5a;
            text-shadow: 0 0 10px rgba(255, 74, 90, 0.2);
        }

        /* Kék világító kis kosár dizájn */
        .cart-icon-visual {
            width: 38px;
            height: 38px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60a5fa;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
        }

        .product-card:hover .cart-icon-visual {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="menu-toggle-btn" id="menuToggle">
            ☰ <span>Kategóriák</span>
        </button>
    </header>

    <nav class="sidebar" id="sidebar">
        <ul class="menu-list">
            
            <li>
                <button class="menu-btn" id="italokToggle">Innivalók <span class="arrow">▶</span></button>
                <ul class="submenu" id="italokSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('energiaitalok')">Energiaitalok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('rostos-italok')">Rostos italok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('szensavas-italok')">Szénsavas üdítők</button></li>
                </ul>
            </li>

            <li>
                <button class="menu-btn" id="edessegToggle">Édességek <span class="arrow">▶</span></button>
                <ul class="submenu" id="edessegSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('edes-edessegek')">Édes édességek</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('sos-edessegek')">Sós édességek</button></li>
                </ul>
            </li>

        </ul>
    </nav>

    <main class="main-content">
        <div class="content-container">
            <h1 id="catTitle" class="category-title">Üdvözöllek!</h1>
            <p id="catDesc" class="category-desc">Kérlek, válassz a bal oldali menüből a termékek megtekintéséhez.</p>
            
            <div class="product-grid" id="productGrid">
            </div>
        </div>
    </main>

    <script>
        // Oldalsáv Nyitás / Csukás
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const body = document.body;

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            body.classList.toggle('sidebar-open');
        });

        // Harmonika menü kezelő
        function setupDropdown(toggleId, submenuId) {
            const toggle = document.getElementById(toggleId);
            const submenu = document.getElementById(submenuId);

            toggle.addEventListener('click', () => {
                const isOpen = toggle.classList.toggle('open');
                
                if (isOpen) {
                    submenu.style.maxHeight = submenu.scrollHeight + 'px';
                    submenu.addEventListener('transitionend', function functionName(e) {
                        if (e.propertyName === 'max-height' && toggle.classList.contains('open')) {
                            submenu.style.maxHeight = 'auto';
                        }
                        submenu.removeEventListener('transitionend', functionName);
                    });
                } else {
                    if(submenu.style.maxHeight === 'auto') {
                        submenu.style.maxHeight = submenu.scrollHeight + 'px';
                        setTimeout(() => {
                            submenu.style.maxHeight = '0px';
                        }, 10);
                    } else {
                        submenu.style.maxHeight = '0px';
                    }
                }
            });
        }

        setupDropdown('italokToggle', 'italokSubmenu');
        setupDropdown('edessegToggle', 'edessegSubmenu');

        // --- TERMÉK ADATBÁZIS ---
        const productsData = {
            'energiaitalok': {
                title: 'Energiaitalok',
                desc: 'Pörgesd fel magad a legnépszerűbb energiaitalokkal!',
                items: [
                    { name: 'Hell Classic 250ml', price: '499 Ft', drs: true, img: 'https://megadrink.cdn.shoprenter.hu/custom/megadrink/image/cache/w570h570wt1q100/product/Uditok/hell-classic-250.jpeg.webp?lastmod=0.1737629933 ' },
                    { name: 'Hell Black Cherry 250ml', price: '499 Ft', drs: true, img: 'https://i0.wp.com/drinkworld.hu/wp-content/uploads/2023/03/hell-blach-cherry.jpg?fit=800%2C800&ssl=1' },
                    { name: 'Hell Lemon Pink-Grapefruit 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/2826/front_hu.10.400.jpg' },
                    { name: 'Hell Caffeine Free 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/0174/front_hu.21.400.jpg' },
                    { name: 'Hell Strong Apple 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/0228/front_hu.36.400.jpg' },
                    { name: 'Hell Strong Red Grape 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/0075/front_hu.32.400.jpg' },
                    { name: 'Hell Strong Watermelon 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/2185/front_fr.14.400.jpg' },
                    { name: 'Hell Focus+ 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/0310/front_hu.25.400.jpg' },
                    { name: 'Hell Zero Classic 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/0419/front_hu.20.400.jpg' },
                    { name: 'Hell Zero Green Apple 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/2628/front_hu.10.400.jpg' },
                    { name: 'Hell Zero Berry 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/2925/front_hu.9.400.jpg' },
                    { name: 'Hell Zero White Peach 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/2901/front_hu.11.400.jpg' },
                    { name: 'Hell Cactus Twist Flavour 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/3021/front_hu.7.400.jpg' },
                    { name: 'Hell Cotton Candy Flavour 250ml', price: '499 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/599/988/280/3007/front_hu.7.400.jpg' }
                ]
            },
            'rostos-italok': {
                title: 'Rostos Italok',
                desc: 'Valódi gyümölcsíz a mindennapokra.',
                items: [
                    { name: 'Sió Alma 25% 1L', price: '690 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/599/739/010/0173/front_hu.21.400.jpg' },
                    { name: 'Sió Narancs 100% 1L', price: '890 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/599/739/010/0197/front_hu.16.400.jpg' },
                    { name: 'Sió Őszibarack 25% 1L', price: '720 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/599/739/010/0210/front_hu.19.400.jpg' }
                ]
            },
            'szensavas-italok': {
                title: 'Szénsavas Üdítők',
                desc: 'Frissítő, buborékos klasszikusok.',
                items: [
                    { name: 'Coca-Cola 0.5L', price: '450 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/544/900/000/0996/front_fr.536.400.jpg' },
                    { name: 'Pepsi Cola 0.5L', price: '430 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/590/049/702/3358/front_pl.68.400.jpg' },
                    { name: 'Fanta Narancs 0.5L', price: '450 Ft', drs: true, img: 'https://images.openfoodfacts.org/images/products/544/900/011/5287/front_de.63.400.jpg' }
                ]
            },
            'edes-edessegek': {
                title: 'Édes Édességek',
                desc: 'Kekszek és csokoládék a nassoláshoz.',
                items: [
                    { name: 'Pilóta Keksz 180g', price: '640 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/762/221/049/2290/front_hu.43.400.jpg' },
                    { name: 'Detki Csokis Cookie 130g', price: '480 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/599/744/611/8633/front_hu.12.400.jpg' }
                ]
            },
            'sos-edessegek': {
                title: 'Sós Édességek / Rágcsák',
                desc: 'Sós finomságok baráti összejövetelekhez.',
                items: [
                    { name: 'Chio Sós Burgonya Chips 130g', price: '690 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/599/720/011/5120/front_hu.30.400.jpg' },
                    { name: 'Elephant Sós Perec 80g', price: '340 Ft', drs: false, img: 'https://images.openfoodfacts.org/images/products/642/474/000/2202/front_hu.22.400.jpg' }
                ]
            }
        };

        // Kategória váltó funkció
        function showCategory(categoryKey) {
            const data = productsData[categoryKey];
            if (!data) return;

            document.getElementById('catTitle').innerText = data.title;
            document.getElementById('catDesc').innerText = data.desc;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            data.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // DRS megjegyzés kezelése
                const drsText = item.drs ? '+50 Ft visszaváltási díj' : '&nbsp;';

                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${item.img}" alt="${item.name}" class="product-img">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-name">${item.name}</div>
                            <div class="drs-notice">${drsText}</div>
                        </div>
                        <div class="product-price-container">
                            <div class="product-price">${item.price}</div>
                            <div class="cart-icon-visual">🛒</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (window.innerWidth < 768) {
                sidebar.classList.remove('active');
                body.classList.remove('sidebar-open');
            }
        }
    </script>
</body>
</html>
