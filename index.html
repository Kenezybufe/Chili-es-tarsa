<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cyber Termék Katalógus</title>
    <style>
        /* Globális alapok és modern betűtípus */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Modern Sötét Háttér */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Felső Fejléc - Áttetsző sötét üveg hatás */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Neon kék világító gomb */
        .menu-toggle-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }

        /* Bal oldali Prémium Sötét Sidebar */
        .sidebar {
            position: fixed;
            top: 70px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 70px);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px 15px;
            overflow-y: auto;
            z-index: 99;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar.active {
            left: 0;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Elegáns Menü gombok */
        .menu-btn {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: #cbd5e1;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .arrow {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #64748b;
        }

        .menu-btn.open .arrow {
            transform: rotate(90deg);
            color: #60a5fa;
        }

        /* Almenü stílusa */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(15, 23, 42, 0.6);
            list-style: none;
            border-radius: 14px;
            margin-top: 5px;
        }

        .submenu-btn {
            width: 100%;
            padding: 14px 25px;
            background: none;
            border: none;
            color: #94a3b8;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .submenu-btn:before {
            content: "•";
            color: #475569;
            margin-right: 12px;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .submenu-btn:hover {
            color: #60a5fa;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Fő tartalom rész */
        .main-content {
            margin-top: 70px;
            padding: 50px 30px;
            width: 100%;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            body.sidebar-open .main-content {
                margin-left: 320px;
            }
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .category-desc {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* --- MODERN TERMÉKRÁCS ÉS KÁRTYÁK --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            padding: 10px 0;
        }

        .product-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Digitális design doboz konténer (nincs többé külső kép hiba!) */
        .product-img-container {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Generált 3D Hatású Eredeti Dobozok */
        .can-mockup {
            width: 70px;
            height: 160px;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: inset -15px 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.6);
            border-top: 4px solid #94a3b8;
            border-bottom: 4px solid #475569;
            transition: transform 0.3s ease;
        }

        .product-card:hover .can-mockup {
            transform: scale(1.1) rotate(3deg);
        }

        /* HELL CLASSIC DIZÁJN (Ördögvörös és fekete) */
        .can-hell-classic {
            background: linear-gradient(to right, #b91c1c, #000000);
            color: #f8fafc;
            border-left: 2px solid #ef4444;
        }
        .can-hell-classic::before {
            content: "😈";
            font-size: 1.8rem;
            text-shadow: 0 0 10px #ef4444;
        }

        /* HELL BLACK CHERRY DIZÁJN (Sötét meggy és fekete) */
        .can-hell-cherry {
            background: linear-gradient(to right, #581c87, #000000);
            color: #f472b6;
            border-left: 2px solid #a855f7;
        }
        .can-hell-cherry::before {
            content: "🍒";
            font-size: 1.8rem;
            text-shadow: 0 0 10px #a855f7;
        }

        /* MONSTER DIZÁJN (Matt fekete neonzöld karmokkal) */
        .can-monster {
            background: linear-gradient(to right, #111827, #000000);
            color: #22c55e;
            border-left: 2px solid #22c55e;
        }
        .can-monster::before {
            content: " Claw ";
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #22c55e;
            text-shadow: 0 0 12px #22c55e;
            transform: rotate(-90deg);
            white-space: nowrap;
        }
        .can-monster::after {
            content: "🟢";
            position: absolute;
            top: 25px;
            font-size: 1rem;
        }

        /* Általános ikon a többi kategóriához */
        .generic-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }
        .product-card:hover .generic-icon {
            transform: scale(1.15);
        }

        /* Információs blokk */
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            background: rgba(30, 41, 59, 0.4);
        }

        .product-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 12px;
            min-height: 44px;
            line-height: 1.4;
        }

        .product-price-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff4a5a;
            text-shadow: 0 0 10px rgba(255, 74, 90, 0.2);
        }

        .cart-icon-visual {
            width: 38px;
            height: 38px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60a5fa;
            transition: background 0.2s, color 0.2s;
        }

        .product-card:hover .cart-icon-visual {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="menu-toggle-btn" id="menuToggle">
            ☰ <span>Kategóriák</span>
        </button>
    </header>

    <nav class="sidebar" id="sidebar">
        <ul class="menu-list">
            <li>
                <button class="menu-btn" id="italokToggle">Innivalók <span class="arrow">▶</span></button>
                <ul class="submenu" id="italokSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('energiaitalok')">Energiaitalok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('rostos-italok')">Rostos italok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('szensavas-italok')">Szénsavas üdítők</button></li>
                </ul>
            </li>
            <li>
                <button class="menu-btn" id="edessegToggle">Édességek <span class="arrow">▶</span></button>
                <ul class="submenu" id="edessegSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('edes-edessegek')">Édes édességek</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('sos-edessegek')">Sós édességek</button></li>
                </ul>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="content-container">
            <h1 id="catTitle" class="category-title">Üdvözöllek!</h1>
            <p id="catDesc" class="category-desc">Kérlek, válassz a bal oldali menüből a termékek megtekintéséhez.</p>
            
            <div class="product-grid" id="productGrid">
                </div>
        </div>
    </main>

    <script>
        // Oldalsáv és Harmonika kezelés
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const body = document.body;

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            body.classList.toggle('sidebar-open');
        });

        function setupDropdown(toggleId, submenuId) {
            const toggle = document.getElementById(toggleId);
            const submenu = document.getElementById(submenuId);
            toggle.addEventListener('click', () => {
                toggle.classList.toggle('open');
                submenu.style.maxHeight = (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') ? '0px' : submenu.scrollHeight + 'px';
            });
        }
        setupDropdown('italokToggle', 'italokSubmenu');
        setupDropdown('edessegToggle', 'edessegSubmenu');

        // --- ADATBÁZIS DIGITÁLIS GENERÁLÁSSAL (100% STABILITÁS) ---
        const productsData = {
            'energiaitalok': {
                title: 'Energiaitalok',
                desc: 'A legnépszerűbb pörgetők pontos gyári arculattal.',
                items: [
                    { name: 'Hell Classic 250ml', price: '320 Ft', type: 'mockup', styleClass: 'can-hell-classic', label: 'HELL' },
                    { name: 'Hell Black Cherry 250ml', price: '320 Ft', type: 'mockup', styleClass: 'can-hell-cherry', label: 'HELL' },
                    { name: 'Monster Energy Original 500ml', price: '650 Ft', type: 'mockup', styleClass: 'can-monster', label: 'M' }
                ]
            },
            'rostos-italok': {
                title: 'Rostos Italok',
                desc: 'Természetes gyümölcsízek.',
                items: [
                    { name: 'Sió Alma 25% 1L', price: '690 Ft', type: 'icon', icon: '🍎' },
                    { name: 'Sió Narancs 100% 1L', price: '890 Ft', type: 'icon', icon: '🍊' },
                    { name: 'Sió Őszibarack 25% 1L', price: '720 Ft', type: 'icon', icon: '🍑' }
                ]
            },
            'szensavas-italok': {
                title: 'Szénsavas Üdítők',
                desc: 'Frissítő buborékos klasszikusok.',
                items: [
                    { name: 'Coca-Cola 0.5L', price: '450 Ft', type: 'icon', icon: '🥤' },
                    { name: 'Pepsi Cola 0.5L', price: '430 Ft', type: 'icon', icon: '🔵' },
                    { name: 'Fanta Narancs 0.5L', price: '450 Ft', type: 'icon', icon: '🍹' }
                ]
            },
            'edes-edessegek': {
                title: 'Édes Édességek',
                desc: 'Finom ropogós sütemények.',
                items: [
                    { name: 'Pilóta Keksz 180g', price: '640 Ft', type: 'icon', icon: '🍪' },
                    { name: 'Detki Csokis Cookie 130g', price: '480 Ft', type: 'icon', icon: '🍫' }
                ]
            },
            'sos-edessegek': {
                title: 'Sós Édességek / Rágcsák',
                desc: 'Sós falatok bulikhoz.',
                items: [
                    { name: 'Chio Sós Burgonya Chips 130g', price: '690 Ft', type: 'icon', icon: '🍿' },
                    { name: 'Elephant Sós Perec 80g', price: '340 Ft', type: 'icon', icon: '🥨' }
                ]
            }
        };

        function showCategory(categoryKey) {
            const data = productsData[categoryKey];
            if (!data) return;

            document.getElementById('catTitle').innerText = data.title;
            document.getElementById('catDesc').innerText = data.desc;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            data.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Vizuális tartalom eldöntése hiba nélkül
                let visualHtml = '';
                if(item.type === 'mockup') {
                    visualHtml = `<div class="can-mockup ${item.styleClass}">${item.label}</div>`;
                } else {
                    visualHtml = `<div class="generic-icon">${item.icon}</div>`;
                }

                card.innerHTML = `
                    <div class="product-img-container">
                        ${visualHtml}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price-container">
                            <div class="product-price">${item.price}</div>
                            <div class="cart-icon-visual">🛒</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (window.innerWidth < 768) {
                sidebar.classList.remove('active');
                body.classList.remove('sidebar-open');
            }
        }
    </script>
</body>
</html>
