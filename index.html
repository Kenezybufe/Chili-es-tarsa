<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csiri és Társa - Premium Katalógus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: #e6f0fa; /* Világos kék háttér */
            color: #0b1a2e; 
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
        }

        /* Animált háttér - finom fénypontok */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(13, 78, 143, 0.12), transparent),
                radial-gradient(1px 1px at 300px 200px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(1px 1px at 400px 100px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 500px 300px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(1px 1px at 600px 150px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 700px 400px, rgba(13, 78, 143, 0.12), transparent),
                radial-gradient(1px 1px at 800px 250px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(1px 1px at 900px 350px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 1000px 180px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(1px 1px at 1100px 420px, rgba(13, 78, 143, 0.12), transparent);
            background-size: 200px 200px;
            background-repeat: repeat;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* Glow orbok - világos kékhez igazítva */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: rgba(59, 130, 246, 0.15);
            top: -100px;
            right: -100px;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.1);
            bottom: -50px;
            left: -50px;
            animation-delay: -3s;
        }

        .glow-orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(236, 72, 153, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* HEADER - világos kékhez igazítva */
        .header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 72px; 
            background: rgba(230, 240, 250, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 40px; 
            z-index: 100; 
            border-bottom: 1px solid rgba(13, 78, 143, 0.08);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #1a5bb5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-brand span {
            font-size: 1.6rem;
            -webkit-text-fill-color: initial;
            color: #1a5bb5;
        }

        .menu-toggle-btn { 
            background: rgba(13, 78, 143, 0.08);
            border: 1px solid rgba(13, 78, 143, 0.12);
            color: #0b1a2e; 
            padding: 10px 24px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .menu-toggle-btn:hover { 
            background: rgba(13, 78, 143, 0.15);
            transform: scale(1.03);
            border-color: rgba(13, 78, 143, 0.2);
        }

        /* SIDEBAR - világos kékhez igazítva */
        .sidebar { 
            position: fixed; 
            top: 72px; 
            left: -340px; 
            width: 340px; 
            height: calc(100vh - 72px); 
            background: rgba(240, 248, 255, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 24px 20px; 
            z-index: 99; 
            overflow-y: auto; 
            border-right: 1px solid rgba(13, 78, 143, 0.08);
        }

        .sidebar.active { left: 0; }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
        
        .menu-btn { 
            width: 100%; 
            padding: 14px 18px; 
            background: rgba(13, 78, 143, 0.04); 
            border: 1px solid rgba(13, 78, 143, 0.06); 
            color: #0b1a2e; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            text-align: left; 
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .menu-btn:hover { 
            background: rgba(13, 78, 143, 0.08);
            border-color: rgba(13, 78, 143, 0.12);
            transform: translateX(4px);
        }
        
        .submenu { 
            display: none; 
            padding-left: 16px; 
            margin-bottom: 10px; 
            border-left: 2px solid rgba(13, 78, 143, 0.08);
            margin-left: 8px;
        }

        .submenu.show { display: block; }

        .submenu-btn { 
            width: 100%; 
            padding: 10px 14px; 
            background: none; 
            border: none; 
            color: #1e3a5f; 
            cursor: pointer; 
            text-align: left; 
            transition: all 0.3s ease;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .submenu-btn:hover { 
            color: #1a5bb5; 
            background: rgba(59, 130, 246, 0.08);
            padding-left: 18px;
        }

        .submenu-btn::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: rgba(13, 78, 143, 0.15);
            border-radius: 50%;
            margin-right: 10px;
            transition: all 0.3s ease;
        }

        .submenu-btn:hover::before {
            background: #1a5bb5;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* MAIN CONTENT */
        .main-content { 
            margin-top: 72px; 
            padding: 50px 40px; 
            position: relative;
            z-index: 1;
        }

        .content-container { 
            max-width: 1300px; 
            margin: 0 auto; 
        }
        
        .logo-container { 
            text-align: center; 
            margin-bottom: 40px; 
        }

        .logo-hero { 
            max-width: 220px; 
            border-radius: 24px; 
            box-shadow: 0 20px 60px rgba(13, 78, 143, 0.15);
            transition: transform 0.5s ease;
        }

        .logo-hero:hover {
            transform: scale(1.02);
        }
        
        .category-title { 
            font-size: 3rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #1a5bb5 0%, #7c3aed 40%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px; 
            letter-spacing: -1px;
        }

        .category-desc { 
            color: #2c4c73; 
            font-size: 1.1rem; 
            margin-bottom: 30px; 
            font-weight: 400;
        }
        
        .brand-section { 
            margin-bottom: 50px; 
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-title { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: #0b1a2e; 
            margin-bottom: 18px; 
            padding-bottom: 12px; 
            border-bottom: 2px solid rgba(13, 78, 143, 0.08); 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            letter-spacing: -0.3px;
        }

        .brand-title .brand-icon { 
            font-size: 1.8rem; 
        }

        .brand-title .brand-count {
            font-size: 0.8rem;
            font-weight: 400;
            color: #2c4c73;
            margin-left: auto;
            background: rgba(13, 78, 143, 0.06);
            padding: 2px 14px;
            border-radius: 50px;
        }
        
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); 
            gap: 24px; 
        }

        .product-card { 
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px; 
            padding: 20px; 
            border: 1px solid rgba(13, 78, 143, 0.06); 
            display: flex; 
            flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.04), rgba(139, 92, 246, 0.04));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 20px;
        }

        .product-card:hover { 
            transform: translateY(-6px); 
            border-color: rgba(13, 78, 143, 0.12);
            box-shadow: 0 20px 50px rgba(13, 78, 143, 0.08);
            background: rgba(255, 255, 255, 0.8);
        }

        .product-card:hover::before {
            opacity: 1;
        }
        
        .product-img-container { 
            width: 100%; 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(13, 78, 143, 0.04);
            border-radius: 14px; 
            margin-bottom: 16px; 
            overflow: hidden;
            position: relative;
        }

        .product-img { 
            max-width: 85%; 
            max-height: 85%; 
            object-fit: contain; 
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-img-placeholder { 
            width: 60px; 
            height: 60px; 
            background: rgba(13, 78, 143, 0.06); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2rem; 
            color: #2c4c73; 
            border: 2px dashed rgba(13, 78, 143, 0.1);
        }
        
        .product-name { 
            font-weight: 600; 
            margin-bottom: 4px; 
            flex-grow: 1; 
            font-size: 0.92rem; 
            line-height: 1.4;
            color: #0b1a2e;
        }

        .product-price { 
            color: #db2777; 
            font-weight: 800; 
            font-size: 1.25rem; 
            margin-top: 8px;
            letter-spacing: -0.3px;
        }

        .drs-notice { 
            font-size: 0.75rem; 
            color: #2c4c73; 
            min-height: 20px; 
            font-weight: 400;
        }

        .drs-notice.drs { 
            color: #b45309; 
        }

        .drs-notice.drs::before {
            content: '♻️ ';
        }

        .product-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(251, 191, 36, 0.15);
            color: #b45309;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 50px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .header { padding: 0 20px; }
            .header-brand { font-size: 1rem; }
            .sidebar { width: 300px; left: -300px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .category-title { font-size: 2rem; }
            .main-content { padding: 24px 16px; }
            .brand-title { font-size: 1.2rem; }
            .menu-toggle-btn { padding: 8px 16px; font-size: 0.8rem; }
            .glow-orb-1, .glow-orb-2, .glow-orb-3 { display: none; }
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .product-card { padding: 14px; }
            .product-img-container { height: 140px; }
            .product-name { font-size: 0.8rem; }
            .product-price { font-size: 1.1rem; }
        }
    </style>
</head>

        function renderProductCard(item) {
            const imgHtml = item.img ? 
                `<img src="${item.img}" class="product-img" onerror="this.parentElement.innerHTML='<div class=\\'product-img-placeholder\\'>${getPlaceholder(item.name)}</div>'">` :
                `<div class="product-img-placeholder">${getPlaceholder(item.name)}</div>`;
            
            const badge = item.drs ? `<div class="badge">♻️ DRS</div>` : '';
            
            return `
                <div class="product-card">
                    ${badge}
                    <div class="product-img-container">${imgHtml}</div>
                    <div class="product-name">${item.name}</div>
                    <div class="drs-notice ${item.drs ? 'drs' : ''}">${item.drs ? 'Visszaváltási díj: +50 Ft' : '&nbsp;'}</div>
                    <div class="product-price">${item.price}</div>
                </div>
            `;
        }

        function showCategory(key) {
            const data = productsData[key];
            document.getElementById('catTitle').innerText = data.title;
            document.getElementById('catDesc').innerText = data.desc;
            
            let html = '';
            data.brands.forEach(brand => {
                html += `
                    <div class="brand-section">
                        <div class="brand-title">
                            <span class="brand-icon">${brand.icon}</span>
                            ${brand.name}
                            <span class="brand-count">${brand.items.length} termék</span>
                        </div>
                        <div class="product-grid">
                            ${brand.items.map(item => renderProductCard(item)).join('')}
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('productContainer').innerHTML = html;
            document.getElementById('sidebar').classList.remove('active');
        }

        function toggleSubmenu(id) { 
            document.getElementById(id).classList.toggle('show'); 
        }
        
        document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('active');
        
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.getElementById('menuToggle');
            if (sidebar.classList.contains('active') && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });
    </script>
