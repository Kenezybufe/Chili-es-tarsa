<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prémium Termék Katalógus</title>
    <style>
        /* Globális alapok és modern betűtípus */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #2d3748;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Felső Fejléc - Modern, áttetsző "Glass" hatás */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(25f, 31, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-toggle-btn {
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(49, 130, 206, 0.4);
        }

        /* Bal oldali Prémium Sidebar */
        .sidebar {
            position: fixed;
            top: 70px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 70px);
            background-color: #1a202c;
            color: #fff;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px 15px;
            overflow-y: auto;
            z-index: 99;
            box-shadow: 5px 0 25px rgba(0,0,0,0.15);
        }

        .sidebar.active {
            left: 0;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Elegáns Menü gombok */
        .menu-btn {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #e2e8f0;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: rgba(49, 130, 206, 0.15);
            border-color: #3182ce;
            color: #63b3ed;
        }

        .arrow {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #a0aec0;
        }

        .menu-btn.open .arrow {
            transform: rotate(90deg);
            color: #63b3ed;
        }

        /* Almenü stílusa */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #141923;
            list-style: none;
            border-radius: 12px;
            margin-top: 5px;
        }

        .submenu-btn {
            width: 100%;
            padding: 12px 25px;
            background: none;
            border: none;
            color: #a0aec0;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .submenu-btn:before {
            content: "•";
            color: #4a5568;
            margin-right: 10px;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .submenu-btn:hover {
            color: #63b3ed;
            background: rgba(255, 255, 255, 0.02);
        }

        .submenu-btn:hover:before {
            color: #3182ce;
        }

        /* Fő tartalom rész */
        .main-content {
            margin-top: 70px;
            padding: 50px 30px;
            width: 100%;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            body.sidebar-open .main-content {
                margin-left: 320px;
            }
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .category-desc {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* --- EXKLUZÍV FÜGGŐLEGES TERMÉKRÁCS --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            padding: 10px 0;
        }

        /* Prémium Termékkártya stílusa */
        .product-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08);
        }

        /* Termék képe konténer */
        .product-img-container {
            width: 100%;
            height: 240px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: radial-gradient(circle, #ffffff 0%, #f7fafc 100%);
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Kártya alsó infó része */
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            background: #fff;
            border-top: 1px solid #edf2f7;
        }

        .product-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
            min-height: 44px;
            line-height: 1.4;
        }

        .product-price-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #e53e3e; /* Modernebb, telt piros ár */
        }

        /* Kis díszítő kosár ikon helye az árnál (csak vizuális elemként) */
        .cart-icon-visual {
            width: 35px;
            height: 35px;
            background: #f7fafc;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5568;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="menu-toggle-btn" id="menuToggle">
            ☰ <span>Kategóriák</span>
        </button>
    </header>

    <nav class="sidebar" id="sidebar">
        <ul class="menu-list">
            
            <li>
                <button class="menu-btn" id="italokToggle">Innivalók <span class="arrow">▶</span></button>
                <ul class="submenu" id="italokSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('energiaitalok')">Energiaitalok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('rostos-italok')">Rostos italok</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('szensavas-italok')">Szénsavas üdítők</button></li>
                </ul>
            </li>

            <li>
                <button class="menu-btn" id="edessegToggle">Édességek <span class="arrow">▶</span></button>
                <ul class="submenu" id="edessegSubmenu">
                    <li><button class="submenu-btn" onclick="showCategory('edes-edessegek')">Édes édességek</button></li>
                    <li><button class="submenu-btn" onclick="showCategory('sos-edessegek')">Sós édességek</button></li>
                </ul>
            </li>

        </ul>
    </nav>

    <main class="main-content">
        <div class="content-container">
            <h1 id="catTitle" class="category-title">Üdvözöllek!</h1>
            <p id="catDesc" class="category-desc">Kérlek, válassz a bal oldali menüből a termékek megtekintéséhez.</p>
            
            <div class="product-grid" id="productGrid">
                </div>
        </div>
    </main>

    <script>
        // Oldalsáv Nyitás / Csukás
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const body = document.body;

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            body.classList.toggle('sidebar-open');
        });

        // Harmonika menü
        function setupDropdown(toggleId, submenuId) {
            const toggle = document.getElementById(toggleId);
            const submenu = document.getElementById(submenuId);

            toggle.addEventListener('click', () => {
                toggle.classList.toggle('open');
                if (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') {
                    submenu.style.maxHeight = '0px';
                } else {
                    submenu.style.maxHeight = submenu.scrollHeight + 'px';
                }
            });
        }

        setupDropdown('italokToggle', 'italokSubmenu');
        setupDropdown('edessegToggle', 'edessegSubmenu');

        // --- VALÓDI TERMÉKKÉPEK ADATBÁZISA ---
        const productsData = {
            'energiaitalok': {
                title: 'Energiaitalok',
                desc: 'Pörgesd fel magad a legnépszerűbb energiaitalokkal!',
                items: [
                    { name: 'Hell Classic 250ml', price: '320 Ft', img: 'https://groby.hu/media/product/6c8ff_hell-classic-szensavas-energiaital-250-ml.jpg' },
                    { name: 'Hell Black Cherry 250ml', price: '320 Ft', img: 'https://groby.hu/media/product/bc372_hell-black-cherry-szensavas-energiaital-250-ml.jpg' },
                    { name: 'Monster Energy Original 500ml', price: '650 Ft', img: 'https://groby.hu/media/product/2e283_monster-energy-szensavas-energiaital-500-ml.jpg' }
                ]
            },
            'rostos-italok': {
                title: 'Rostos Italok',
                desc: 'Valódi gyümölcsíz a mindennapokra.',
                items: [
                    { name: 'Sió Alma 25% 1L', price: '690 Ft', img: 'https://groby.hu/media/product/0f7e4_sio-almale-25-1-l.jpg' },
                    { name: 'Sió Narancs 100% 1L', price: '890 Ft', img: 'https://groby.hu/media/product/490ec_sio-narancsle-100-1-l.jpg' },
                    { name: 'Sió Őszibarack 25% 1L', price: '720 Ft', img: 'https://groby.hu/media/product/ef40a_sio-oszibarack-ital-25-1-l.jpg' }
                ]
            },
            'szensavas-italok': {
                title: 'Szénsavas Üdítők',
                desc: 'Frissítő, buborékos klasszikusok.',
                items: [
                    { name: 'Coca-Cola 0.5L', price: '450 Ft', img: 'https://groby.hu/media/product/a5332_coca-cola-szensavas-uditoital-500-ml.jpg' },
                    { name: 'Pepsi Cola 0.5L', price: '430 Ft', img: 'https://groby.hu/media/product/783bd_pepsi-cola-szensavas-uditoital-500-ml.jpg' },
                    { name: 'Fanta Narancs 0.5L', price: '450 Ft', img: 'https://groby.hu/media/product/a7cb4_fanta-narancs-szensavas-uditoital-500-ml.jpg' }
                ]
            },
            'edes-edessegek': {
                title: 'Édes Édességek',
                desc: 'Kekszek és csokoládék a nassoláshoz.',
                items: [
                    { name: 'Pilóta Keksz 180g', price: '640 Ft', img: 'https://groby.hu/media/product/00c5c_pilota-tott-keksz-180-g.jpg' },
                    { name: 'Detki Csokis Cookie 130g', price: '480 Ft', img: 'https://groby.hu/media/product/70c53_detki-csokis-orias-cookie-130-g.jpg' }
                ]
            },
            'sos-edessegek': {
                title: 'Sós Édességek / Rágcsák',
                desc: 'Sós finomságok baráti összejövetelekhez.',
                items: [
                    { name: 'Chio Sós Burgonya Chips 130g', price: '690 Ft', img: 'https://groby.hu/media/product/6efb5_chio-chips-sos-burgonyachips-130-g.jpg' },
                    { name: 'Elephant Sós Perec 80g', price: '340 Ft', img: 'https://groby.hu/media/product/99446_elephant-press-and-crack-perec-sos-80-g.jpg' }
                ]
            }
        };

        // Kategória váltó funkció
        function showCategory(categoryKey) {
            const data = productsData[categoryKey];
            if (!data) return;

            document.getElementById('catTitle').innerText = data.title;
            document.getElementById('catDesc').innerText = data.desc;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            data.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${item.img}" alt="${item.name}" class="product-img">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price-container">
                            <div class="product-price">${item.price}</div>
                            <div class="cart-icon-visual">🛒</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (window.innerWidth < 768) {
                sidebar.classList.remove('active');
                body.classList.remove('sidebar-open');
            }
        }
    </script>
</body>
</html>
