<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csiri és Társa · Premium katalógus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        /* —— alap téma (világos) —— */
        :root {
            --bg-body: #e6f0fa;
            --bg-header: rgba(230, 240, 250, 0.85);
            --border-header: rgba(13, 78, 143, 0.08);
            --text-primary: #0b1a2e;
            --text-secondary: #1e3a5f;
            --text-muted: #2c4c73;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(13, 78, 143, 0.06);
            --card-hover-bg: rgba(255, 255, 255, 0.8);
            --sidebar-bg: rgba(240, 248, 255, 0.92);
            --sidebar-border: rgba(13, 78, 143, 0.08);
            --btn-bg: linear-gradient(135deg, #1a5bb5, #4f46e5);
            --btn-hover: linear-gradient(135deg, #2563eb, #6366f1);
            --badge-bg: rgba(251, 191, 36, 0.15);
            --badge-color: #b45309;
            --glow-1: rgba(59, 130, 246, 0.15);
            --glow-2: rgba(139, 92, 246, 0.1);
            --glow-3: rgba(236, 72, 153, 0.08);
            --shadow-card: 0 20px 50px rgba(13, 78, 143, 0.08);
            --shadow-btn: 0 4px 16px rgba(26, 91, 181, 0.25);
        }

        /* —— sötét téma —— */
        body.dark {
            --bg-body: #0f172a;
            --bg-header: rgba(15, 23, 42, 0.9);
            --border-header: rgba(255, 255, 255, 0.06);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: rgba(30, 41, 59, 0.9);
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --sidebar-border: rgba(255, 255, 255, 0.06);
            --btn-bg: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --btn-hover: linear-gradient(135deg, #60a5fa, #a78bfa);
            --badge-bg: rgba(251, 191, 36, 0.2);
            --badge-color: #fcd34d;
            --glow-1: rgba(59, 130, 246, 0.2);
            --glow-2: rgba(139, 92, 246, 0.15);
            --glow-3: rgba(236, 72, 153, 0.12);
            --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.4);
            --shadow-btn: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.3s ease, color 0.2s ease;
        }

        /* csillogó háttérpontok (mindkét téma) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(13, 78, 143, 0.12), transparent),
                radial-gradient(1px 1px at 300px 200px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(1px 1px at 400px 100px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 500px 300px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(1px 1px at 600px 150px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 700px 400px, rgba(13, 78, 143, 0.12), transparent),
                radial-gradient(1px 1px at 800px 250px, rgba(13, 78, 143, 0.2), transparent),
                radial-gradient(1px 1px at 900px 350px, rgba(13, 78, 143, 0.1), transparent),
                radial-gradient(1px 1px at 1000px 180px, rgba(13, 78, 143, 0.15), transparent),
                radial-gradient(1px 1px at 1100px 420px, rgba(13, 78, 143, 0.12), transparent);
            background-size: 200px 200px;
            background-repeat: repeat;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.7; }
        }

        /* izzó gömbök */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
            transition: background 0.4s ease;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: var(--glow-1);
            top: -100px;
            right: -100px;
        }
        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: var(--glow-2);
            bottom: -50px;
            left: -50px;
            animation-delay: -3s;
        }
        .glow-orb-3 {
            width: 300px;
            height: 300px;
            background: var(--glow-3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* —— HEADER —— */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            border-bottom: 1px solid var(--border-header);
            transition: background 0.3s ease, border 0.2s ease;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #1a5bb5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-brand span {
            font-size: 1.6rem;
            -webkit-text-fill-color: initial;
            color: #1a5bb5;
        }
        body.dark .header-brand span { color: #60a5fa; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            background: var(--btn-bg);
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            box-shadow: var(--shadow-btn);
            backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }
        .menu-toggle-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(26, 91, 181, 0.35);
        }
        .menu-toggle-btn:active { transform: scale(0.97); }

        /* ⚙️ settings gomb */
        .settings-btn {
            background: rgba(13, 78, 143, 0.08);
            border: 1px solid var(--border-header);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
        }
        .settings-btn:hover {
            background: var(--card-hover-bg);
            transform: rotate(30deg) scale(1.05);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* —— SIDEBAR —— */
        .sidebar {
            position: fixed;
            top: 72px;
            left: -340px;
            width: 340px;
            height: calc(100vh - 72px);
            background: var(--sidebar-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px 20px;
            z-index: 99;
            overflow-y: auto;
            border-right: 1px solid var(--sidebar-border);
        }
        .sidebar.active { left: 0; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }

        .menu-btn {
            width: 100%;
            padding: 14px 18px;
            background: rgba(13, 78, 143, 0.04);
            border: 1px solid rgba(13, 78, 143, 0.06);
            color: var(--text-primary);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .menu-btn:hover {
            background: rgba(13, 78, 143, 0.08);
            border-color: rgba(13, 78, 143, 0.12);
            transform: translateX(4px);
        }
        .submenu {
            display: none;
            padding-left: 16px;
            margin-bottom: 10px;
            border-left: 2px solid rgba(13, 78, 143, 0.08);
            margin-left: 8px;
        }
        .submenu.show { display: block; }
        .submenu-btn {
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            border-radius: 8px;
        }
        .submenu-btn:hover {
            color: #1a5bb5;
            background: rgba(59, 130, 246, 0.08);
            padding-left: 18px;
        }
        body.dark .submenu-btn:hover { color: #60a5fa; }
        .submenu-btn::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: rgba(13, 78, 143, 0.15);
            border-radius: 50%;
            margin-right: 10px;
            transition: all 0.3s ease;
        }
        .submenu-btn:hover::before {
            background: #1a5bb5;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* —— MAIN —— */
        .main-content {
            margin-top: 72px;
            padding: 50px 40px;
            position: relative;
            z-index: 1;
        }
        .content-container { max-width: 1300px; margin: 0 auto; }

        .logo-container {
            text-align: center;
            margin-top: 10px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .logo-container.small {
            text-align: left;
            margin-top: 0;
            margin-bottom: 16px;
        }
        .logo-hero {
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(13, 78, 143, 0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .logo-container.small .logo-hero {
            max-width: 80px;
            box-shadow: 0 8px 30px rgba(13, 78, 143, 0.1);
            margin: 0;
        }
        .logo-hero:hover { transform: scale(1.02); }
        .logo-container.small .logo-hero:hover { transform: scale(1.05); }

        .category-title {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1a5bb5 0%, #7c3aed 40%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            letter-spacing: -1px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-title.left {
            text-align: left;
            font-size: 2rem;
            margin-bottom: 2px;
        }
        .category-desc {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 20px;
            font-weight: 400;
            text-align: center;
            transition: color 0.2s ease;
        }
        .category-desc strong {
            color: #1a5bb5;
            font-weight: 700;
            background: rgba(26, 91, 181, 0.08);
            padding: 2px 12px;
            border-radius: 8px;
            border: 1px solid rgba(26, 91, 181, 0.12);
        }
        body.dark .category-desc strong {
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.2);
        }
        .category-desc.left {
            text-align: left;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .brand-section {
            margin-bottom: 50px;
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-header);
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: -0.3px;
        }
        .brand-title .brand-icon { font-size: 1.8rem; }
        .brand-title .brand-count {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: auto;
            background: rgba(13, 78, 143, 0.06);
            padding: 2px 14px;
            border-radius: 50px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.04), rgba(139, 92, 246, 0.04));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 20px;
        }
        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(13, 78, 143, 0.12);
            box-shadow: var(--shadow-card);
            background: var(--card-hover-bg);
        }
        .product-card:hover::before { opacity: 1; }

        .product-img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 78, 143, 0.04);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
        }
        .product-img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-img { transform: scale(1.05); }
        .product-img-placeholder {
            width: 60px; height: 60px;
            background: rgba(13, 78, 143, 0.06);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--text-muted);
            border: 2px dashed rgba(13, 78, 143, 0.1);
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 4px;
            flex-grow: 1;
            font-size: 0.92rem;
            line-height: 1.4;
            color: var(--text-primary);
        }
        .product-price {
            color: #db2777;
            font-weight: 800;
            font-size: 1.25rem;
            margin-top: 8px;
            letter-spacing: -0.3px;
        }
        body.dark .product-price { color: #f472b6; }

        .drs-notice {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-height: 20px;
            font-weight: 400;
        }
        .drs-notice.drs { color: #b45309; }
        body.dark .drs-notice.drs { color: #fcd34d; }
        .drs-notice.drs::before { content: '♻️ '; }

        .product-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--badge-bg);
            color: var(--badge-color);
            font-size: 0.6rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 50px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* —— SETTINGS OVERLAY —— */
        .settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        .settings-overlay.open { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-panel {
            background: var(--bg-body);
            border: 1px solid var(--border-header);
            border-radius: 32px;
            padding: 32px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.25);
            transition: background 0.3s ease;
        }
        .settings-panel h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }
        .settings-panel h2 span { font-size: 1.8rem; }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 22px;
        }
        .settings-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-group select, .settings-group button {
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .settings-group select:hover, .settings-group button:hover {
            border-color: rgba(59, 130, 246, 0.3);
            background: var(--card-hover-bg);
        }
        .settings-group select:focus { outline: none; border-color: #3b82f6; }

        .settings-close {
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: var(--btn-bg);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-btn);
        }
        .settings-close:hover {
            background: var(--btn-hover);
            transform: scale(1.02);
        }

        /* —— reszponzív —— */
        @media (max-width: 768px) {
            .header { padding: 0 20px; }
            .header-brand { font-size: 1rem; }
            .sidebar { width: 300px; left: -300px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .category-title { font-size: 2.2rem; }
            .category-title.left { font-size: 1.5rem; }
            .main-content { padding: 24px 16px; }
            .brand-title { font-size: 1.2rem; }
            .menu-toggle-btn { padding: 8px 20px; font-size: 0.85rem; }
            .glow-orb-1, .glow-orb-2, .glow-orb-3 { display: none; }
            .logo-hero { max-width: 320px; }
            .logo-container.small .logo-hero { max-width: 60px; }
            .settings-panel { padding: 24px 20px; }
        }
        @media (max-width: 480px) {
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .product-card { padding: 14px; }
            .product-img-container { height: 140px; }
            .product-name { font-size: 0.8rem; }
            .product-price { font-size: 1.1rem; }
            .logo-hero { max-width: 220px; }
            .logo-container.small .logo-hero { max-width: 50px; }
            .category-title { font-size: 1.8rem; }
            .category-title.left { font-size: 1.3rem; }
            .menu-toggle-btn { padding: 6px 16px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <header class="header">
        <div class="header-brand"><span>✨</span> Csiri & Társa</div>
        <div class="header-actions">
            <button class="settings-btn" id="settingsToggle" aria-label="Beállítások">⚙️</button>
            <button class="menu-toggle-btn" id="menuToggle"><span>☰</span> Kategóriák</button>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <button class="menu-btn" id="menuDrinks" onclick="toggleSubmenu('italokSubmenu')">🥤 Üdítők ▼</button>
        <ul class="submenu show" id="italokSubmenu">
            <li><button class="submenu-btn" data-key="energiaitalok" onclick="showCategory('energiaitalok')">Energiaitalok</button></li>
            <li><button class="submenu-btn" data-key="rostos-italok" onclick="showCategory('rostos-italok')">Rostos italok</button></li>
            <li><button class="submenu-btn" data-key="uditok" onclick="showCategory('uditok')">Üdítők</button></li>
            <li><button class="submenu-btn" data-key="jegesteak" onclick="showCategory('jegesteak')">Jeges teák</button></li>
            <li><button class="submenu-btn" data-key="asvanyvizek" onclick="showCategory('asvanyvizek')">Ásványvizek</button></li>

        </ul>

        // ----- segédletek -----
        function getPlaceholder(name) {
            const emojis = { 'Hell':'⚡','Monster':'👹','Red Bull':'🐂','Coca-Cola':'🥤','Pepsi':'🥤','Sprite':'💚','Lipton':'🧋','Schweppes':'🍋','Canada Dry':'🥤','Mountain Dew':'💚','Mirinda':'🍊','Szentkirályi':'💧','Emese':'💧','Toma':'🍎','Sió':'🧃','Szobi':'🧃','Topjoy':'🧃','Gatorade':'🏃','Pilóta':'🍪','Detki':'🍪','Chio':'🥨','Elephant':'🥨' };
            for (let k in emojis) if (name.includes(k)) return emojis[k];
            return '📦';
        }

        let currentLang = 'hu';
        let isHome = true;

        function renderProductCard(item) {
            const imgHtml = item.img ? `<img src="${item.img}" class="product-img" onerror="this.parentElement.innerHTML='<div class=\\'product-img-placeholder\\'>${getPlaceholder(item.name)}</div>'">` : `<div class="product-img-placeholder">${getPlaceholder(item.name)}</div>`;
            const badge = item.drs ? `<div class="badge">♻️ DRS</div>` : '';
            return `<div class="product-card">${badge}<div class="product-img-container">${imgHtml}</div><div class="product-name">${item.name}</div><div class="drs-notice ${item.drs?'drs':''}">${item.drs ? 'Visszaváltási díj: +50 Ft' : '&nbsp;'}</div><div class="product-price">${item.price}</div></div>`;
        }

        function showCategory(key) {
            const data = productsData[key];
            if (!data) return;
            const titleEl = document.getElementById('catTitle');
            const descEl = document.getElementById('catDesc');
            const logoContainer = document.getElementById('logoContainer');
            isHome = false;
            window._currentCategory = key;
            logoContainer.classList.add('small');
            titleEl.classList.add('left');
            titleEl.innerText = data.title[currentLang] || data.title.hu;
            descEl.classList.add('left');
            descEl.innerText = data.desc[currentLang] || data.desc.hu;
            let html = '';
            data.brands.forEach(brand => {
                html += `<div class="brand-section"><div class="brand-title"><span class="brand-icon">${brand.icon}</span>${brand.name}<span class="brand-count">${brand.items.length} termék</span></div><div class="product-grid">${brand.items.map(renderProductCard).join('')}</div></div>`;
            });
            document.getElementById('productContainer').innerHTML = html;
            document.getElementById('sidebar').classList.remove('active');
        }

        function goHome() {
            isHome = true;
            window._currentCategory = null;
            const titleEl = document.getElementById('catTitle');
            const descEl = document.getElementById('catDesc');
            const logoContainer = document.getElementById('logoContainer');
            logoContainer.classList.remove('small');
            titleEl.classList.remove('left');
            titleEl.innerText = currentLang === 'hu' ? 'Üdvözöllek!' : 'Welcome!';
            descEl.classList.remove('left');
            descEl.innerText = currentLang === 'hu' ? 'Kérlek, válassz a Kategóriák menüből!' : 'Please choose from Categories!';
            document.getElementById('productContainer').innerHTML = '';
        }

        // ----- MENÜ FRISSÍTÉS NYELV VÁLTÁSKOR -----
        function updateMenuLanguage(lang) {
            const t = menuTranslations[lang] || menuTranslations.hu;
            document.getElementById('menuDrinks').innerHTML = t.drinks;
            document.getElementById('menuSweets').innerHTML = t.sweets;
            const drinkSubs = document.querySelectorAll('#italokSubmenu .submenu-btn');
            const sweetSubs = document.querySelectorAll('#edessegSubmenu .submenu-btn');
            t.subDrinks.forEach((txt, i) => { if (drinkSubs[i]) drinkSubs[i].innerText = txt; });
            t.subSweets.forEach((txt, i) => { if (sweetSubs[i]) sweetSubs[i].innerText = txt; });
        }

        // ----- ESEMÉNYEK -----
        document.getElementById('logoImage').addEventListener('click', function(e) { if (!isHome) goHome(); });

        function toggleSubmenu(id) { document.getElementById(id).classList.toggle('show'); }

        document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('active');
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.getElementById('menuToggle');
            if (sidebar.classList.contains('active') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('active');
        });

        // ----- SETTINGS -----
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsClose = document.getElementById('settingsClose');
        const langSelect = document.getElementById('langSelect');
        const darkModeBtn = document.getElementById('darkModeToggle');

        function openSettings() { settingsOverlay.classList.add('open'); }
        function closeSettings() { settingsOverlay.classList.remove('open'); }

        settingsToggle.addEventListener('click', openSettings);
        settingsClose.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings(); });

        // nyelvváltás – frissíti a menüt és a tartalmat
        langSelect.addEventListener('change', function() {
            currentLang = this.value;
            updateMenuLanguage(currentLang);
            if (isHome) {
                goHome();
            } else if (window._currentCategory) {
                const data = productsData[window._currentCategory];
                if (data) {
                    document.getElementById('catTitle').innerText = data.title[currentLang] || data.title.hu;
                    document.getElementById('catDesc').innerText = data.desc[currentLang] || data.desc.hu;
                }
            } else {
                goHome();
            }
        });

        // dark mode toggle
        darkModeBtn.addEventListener('click', function() {
            document.body.classList.toggle('dark');
            this.innerText = document.body.classList.contains('dark') ? '☀️ Világos mód' : '🌙 Sötét mód';
        });

        // kezdőoldal
        goHome();
        // menü alapértelmezett
        updateMenuLanguage('hu');
        langSelect.value = 'hu';
    </script>
</body>
</html>
