<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chili és társa - Árlista</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9; }
h1 { text-align: center; color: #d32f2f; }
.container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.category { margin-top: 20px; }
.category h2 { border-bottom: 2px solid #d32f2f; padding-bottom: 5px; color: #333; }
.item { display: flex; align-items: center; border-bottom: 1px solid #ddd; padding: 10px 0; }
.item img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
.item-details { flex-grow: 1; }
.item-name { font-weight: bold; font-size: 1.1em; color: #222; }
.item-code { font-size: 0.85em; color: #777; }
.item-price { font-weight: bold; color: #d32f2f; font-size: 1.1em; }
</style>
</head>
<body>
<h1>Chili és társa</h1>
<div class="container">
<div class="category">
<h2>Innivalók</h2>
<div class="item">
<img src="hu_cocacola_prod_reg_750x750_v2.jpg" alt="Kóla">
<div class="item-details">
<div class="item-name">Coca-Cola (0.5l)</div>
<div class="item-code">Cikkszám: I-001</div>
</div>
<div class="item-price">550 Ft</div>
</div>
<div class="item">
<img src="placeholder.jpg" alt="Ásványvíz">
<div class="item-details">
<div class="item-name">Szentkirályi Ásványvíz (0.5l)</div>
<div class="item-code">Cikkszám: I-002</div>
</div>
<div class="item-price">400 Ft</div>
</div>
</div>
<div class="category">
<h2>Édességek</h2>
<div class="item">
<img src="placeholder.jpg" alt="Sport szelet">
<div class="item-details">
<div class="item-name">Sport szelet</div>
<div class="item-code">Cikkszám: E-001</div>
</div>
<div class="item-price">250 Ft</div>
</div>
</div>
<div class="category">
<h2>Főtt ételek és Menük</h2>
<div class="item">
<img src="placeholder.jpg" alt="Napi menü">
<div class="item-details">
<div class="item-name">"A" Menü (Leves + Főétel)</div>
<div class="item-code">Cikkszám: M-001</div>
</div>
<div class="item-price">1850 Ft</div>
</div>
</div>
</div>

</html>
